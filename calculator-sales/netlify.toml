# Netlify settings for the Cleaning Calculator Pro SALES PAGE only.
# When connecting this to a NEW Netlify site, set Base directory to: calculator-sales
# (The repository-root netlify.toml belongs to Smart Cleaners Academy; leave it alone.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
